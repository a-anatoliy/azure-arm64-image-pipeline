---
# Image metadata written to /etc/image-release (overridden by Packer).
baseline_image_name: ubuntu-24.04-arm64-baseline
baseline_image_version: dev
baseline_git_sha: unknown

# Fail early if the role runs on an unexpected platform.
baseline_require_arm64: true

# Full package upgrade. Disabled in CI so the test runner is not upgraded.
baseline_upgrade: true

# Start/reload services and apply kernel settings at runtime.
# Set to false when testing inside a container without systemd.
baseline_manage_services: true

baseline_packages:
  - auditd
  - ca-certificates
  - chrony
  - curl
  - jq
  - openssh-server
  - unattended-upgrades

baseline_sshd_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  X11Forwarding: "no"
  AllowAgentForwarding: "no"
  MaxAuthTries: "3"
  LoginGraceTime: "30"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "2"

baseline_sysctl:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.tcp_syncookies: 1
  kernel.randomize_va_space: 2
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
