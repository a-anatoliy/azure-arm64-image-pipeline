---
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
  when: baseline_manage_services | bool

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: baseline_manage_services | bool

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: baseline_manage_services | bool
